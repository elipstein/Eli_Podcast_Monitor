# Podcasts to monitor for Middle Eastern / Israeli cuisine and
# behind-the-scenes chef content.
#
# IMPORTANT: This sandboxed dev session cannot reach arbitrary external
# hosts (outbound network is restricted to an allowlist that does not
# include podcast CDNs), so none of these RSS feed URLs could be
# fetch-verified from inside this session. `feed_url` values below came
# from web search citations, not a live fetch -- confirm each one
# resolves to real XML before relying on it (run the CLI once, or paste
# the URL in a browser / podcast app). Apple Podcasts links are included
# for every show so you can re-derive the feed URL if one is stale
# (most podcast apps have a "copy RSS link" option, or use a lookup
# tool such as https://rss.com/tools/find-my-feed/).
#
# Add, remove, or replace entries freely -- this list is a starting
# point, not an exhaustive "all podcasts" index (no such index exists).
#
# NOT monitored on purpose: לשבת לקחת, מדברים מהבטן, and מאחורי הצלחת
# עם גדי חן. Eli already listens to every episode of these three, so
# there's no point flagging their own episodes -- but their guest lists
# are still valuable, so they've been hand-seeded into keywords.py as
# LASHEVET_LAKACHAT_GUESTS and ACHOREI_HATZLACHAT_GUESTS. Any of those
# guests showing up as an interviewee on one of the podcasts actually
# listed below (or any future one) will still flag.
#
# ALSO not monitored, and not to be re-suggested as "similar podcast"
# discoveries later -- shows Eli already subscribes to, mostly outside
# this project's Middle Eastern/chef scope entirely: Sam Harris (Making
# Sense), Rhonda Patrick (FoundMyFitness), Bill Maher (Real Time / Club
# Random), Pivot, השבוע - פודקאסט הארץ, The Moth, This Is TASTE, And
# Here's Modi, The Daily Churn, Think & Drink Different (host Jeremy
# Fogel), and Absolutely Mental with Ricky Gervais. Two people from
# researching Think & Drink Different -- Jeremy Fogel himself, and chef
# Asaf Doktor, his co-host on כאן's culinary-history documentary
# "הצלחת של הארץ המובטחת" -- were added to OTHER_FAVORITE_CHEFS in
# keywords.py since that show's subject (the ancient Levantine/Israelite
# diet) is squarely on-topic. Researching that documentary also
# surfaced מקורב לצלחת (Dishing Out), added below.

podcasts:
  - name: "Israel Story"
    feed_url: "https://feeds.acast.com/public/shows/1353fdb5-6664-49dc-9858-fc781473a75f"
    apple_podcasts_url: "https://podcasts.apple.com/us/podcast/israel-story/id1048515651"
    note: "Storytelling podcast about Israel; regularly covers food, chefs, and culinary culture."

  - name: "Point of Origin"
